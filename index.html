<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16110a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Shaelyra · Spielbegleiter</title>
<style>
:root{
  --bg:#16110a;--surface:#211a0e;--card:#2b2011;--card2:#33271a;--border:#5e4721;
  --gold:#c9952a;--gold2:#e8b84b;--text:#ebe0cb;--dim:#a38a63;
  --green:#7ab56a;--red:#d0705f;--blue:#7aa6dc;--amber:#e0a43a;--violet:#a18ad8;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;font-size:16px;line-height:1.45;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);
  padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:1.05rem;color:var(--gold2);font-weight:600;letter-spacing:.02em}
header .sub{font-size:.75rem;color:var(--dim)}
.pill{background:var(--card);border:1px solid var(--border);border-radius:99px;padding:3px 10px;font-size:.78rem;color:var(--gold2);white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:12px 12px 20px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:12px;position:relative}
.card h2,.lbl{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;font-weight:600}
.card h3{font-size:.95rem;color:var(--gold2);margin:4px 0 6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.dim{color:var(--dim)} .small{font-size:.8rem} .tiny{font-size:.72rem}
.good{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--amber)}.info{color:var(--blue)}
.btn{background:var(--card2);border:1px solid var(--border);border-radius:8px;min-height:44px;min-width:44px;padding:8px 12px;cursor:pointer;color:var(--text)}
.btn:active{background:#4a3920}
.btn.pri{background:#6b4f12;border-color:var(--gold);color:#fff4d6;font-weight:600}
.btn.dng{border-color:#8a3a30;color:var(--red)}
.btn.sm{min-height:36px;padding:4px 10px;font-size:.88rem}
.btn.full{width:100%}
input[type=number],input[type=text],select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:9px 10px;min-height:44px;width:100%;color:var(--text)}
input[type=number]{text-align:center}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:.82rem;color:var(--dim);margin-bottom:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:340px){.grid3{grid-template-columns:1fr 1fr}}
.check{display:flex;gap:10px;align-items:center;min-height:40px;font-size:.92rem;color:var(--text);margin:0}
.check input{width:22px;height:22px;flex:none;accent-color:var(--gold)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:6px 13px;min-height:36px;color:var(--dim)}
.chip.on{background:#6b4f12;border-color:var(--gold);color:#fff4d6}
/* meters */
.meter .val{font-size:2rem;font-weight:700;line-height:1;color:var(--text);min-width:92px;text-align:center}
.meter .val small{font-size:1rem;color:var(--dim);font-weight:400}
.bar{height:10px;border-radius:6px;background:#120d06;border:1px solid #3d2e14;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--green);transition:width .2s,background .2s}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:.78rem;border:1px solid var(--border);margin:2px 3px 2px 0;background:var(--surface)}
.tag.g{border-color:#3f6a33;color:var(--green)}.tag.r{border-color:#8a3a30;color:var(--red)}.tag.a{border-color:#8a6a1f;color:var(--amber)}.tag.b{border-color:#3a5f8a;color:var(--blue)}
.list button.item{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px;margin-bottom:6px;min-height:48px;text-align:left}
.list button.item:active{background:#4a3920}
.list .nm{font-size:1rem}.list .at{font-size:.74rem;color:var(--dim)}
.list .tw{font-size:1.15rem;color:var(--gold2);font-weight:700;min-width:34px;text-align:right}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.6)}
#sheet.on{display:block}
#sheet .in{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--surface);border-top:2px solid var(--gold);
  border-radius:16px 16px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
#sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
#sheet .hd h2{font-size:1.1rem;color:var(--gold2);text-transform:none;letter-spacing:0;margin:0}
.res{border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-top:10px;background:var(--card)}
.res .big{font-size:1.5rem;font-weight:700}
.res.ok{border-color:#3f6a33}.res.no{border-color:#8a3a30}
.res .t{font-size:.95rem;margin-top:6px}
hr{border:0;border-top:1px solid var(--border);margin:8px 0;opacity:.6}
.bold{font-weight:700;color:var(--gold2)}
.pfeil-box,.var-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:8px;font-size:.88rem}
/* tabbar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);display:flex;
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--dim);padding:8px 1px 7px;min-height:56px;font-size:.66rem;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:1.25rem;line-height:1}
nav button.on{color:var(--gold2);background:linear-gradient(0deg,rgba(201,149,42,.18),transparent)}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t td,table.t th{padding:5px 6px;border-bottom:1px solid #43321a;text-align:left;vertical-align:top}
table.t th{color:var(--gold);font-weight:600;font-size:.76rem}
details{margin-bottom:6px}
details summary{cursor:pointer;min-height:40px;display:flex;align-items:center;color:var(--gold2);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:#6b4f12;border:1px solid var(--gold);
  color:#fff4d6;padding:9px 16px;border-radius:99px;z-index:80;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.eff{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #43321a}
.dice-lbl{font-size:.8rem;color:var(--dim);text-align:center;margin-bottom:2px}
.stepper{display:flex;gap:6px;align-items:center}
.stepper input{text-align:center}
.mono{font-variant-numeric:tabular-nums}
</style>
</head>

<header>
  <div><h1>Shaelyra Firnwind</h1><div class="sub">Firnelfische Kämpferin · Phileasson-Saga</div></div>

</header>
<main>

<!-- ============ STATUS ============ -->
<section class="tab on" id="t-status"></section>
<!-- ============ PROBEN ============ -->

<!-- ============ ZAUBER ============ -->
<section class="tab" id="t-zauber"></section>
<!-- ============ KAMPF ============ -->
<section class="tab" id="t-kampf"></section>
<!-- ============ STEIGERN ============ -->
<section class="tab" id="t-reise"></section>
<section class="tab" id="t-regeln"></section>
<section class="tab" id="t-steigern"></section>

</main>
<nav id="nav">
  <button data-tab="status" class="on"><span class="ic">♥</span>Status</button>

</nav>

  // [Schlüssel, ZfW, Steigerungsspalte, Weltsicht-Aufschlag?]

  nahkampf: [

    {n:'Jagdmesser (Dolche)',at:12,pa:7,tp:'1W+2',ini:-1,wm:'0 / -2',bf:3,note:'DK H'},
    {n:'Tritt/Kopfstoß (Raufen)',at:9,pa:6,tp:'1W+0 (A)',ini:-1,wm:'–',bf:'–',note:'TP(A): Ausdauer, Hälfte auch LeP'},

  bogen: {n:'Elfenbogen', fk:24, tpDice:6, tpPlus:5, ranges:[10,25,50,100,200], rangeTP:[3,2,1,1,0], laden:2},
  falke: {n:'Sir Flatterich III (Blaufalke)', lep:10, aup:90, rs:1, mr:2, at:'5 / 15', pa:'4 / 7', tp:'1W+1', gs:'1 / 30', ini:'—'},

  sf: {

// SE (Spezielle Erfahrungen), Stand Excel
const SE0 = {'Speere':10,'Orientierung':0,'Balsam':0,'Spinnenlauf':8}; // nur Dokumentation, wird unten gebraucht

/* Zaubertexte aus dem früheren Zauberprobe-Tool, Firnlauf neu */
const SP={
adlerauge:{
    n:"Adlerauge Luchsenohr",a:["KL","IN","FF"],c:4,mr:false,ex:false,pfeil:false,
    info:"Probe: KL/IN/FF · Kosten: 4 AsP · Selbst · 1 SR (A) · Komplexität B · Merkmale: Hellsicht, Eigenschaften · Repräsentation: Elf 7; Ach, Dru, Geo, Hex, Mag je 3 · LC S.14",
    w(z,_){
      if(z===null)return"Die Probe ist misslungen – der Zauber wirkt nicht.";
      return`Alle Sinnenschärfe-Proben um <span class="bold">${z} Punkte</span> erleichtert. Kann haarfeine Details ertasten, Geräusche auf Dutzende Schritt wahrnehmen, Gerüche auf 100 Schritt und Gesichter auf eine Meile erkennen (wenn Sinnenschärfe-Probe gelingt).<br><br><span class="bold">Achtung:</span> Plötzlicher Lärm, grelles Licht oder übler Geruch → Selbstbeherrschungs-Probe, sonst W20 Sekunden desorientiert.<br><br><span class="bold">Wirkungsdauer:</span> 1 Spielrunde Grunddauer · Aufrechterhalten: 4 AsP pro weitere SR`;
    }
  },
adlerschwinge:{
    n:"Adlerschwinge (Blaufalke)",a:["MU","IN","GE"],c:4,mr:false,ex:true,xl:"Laufende AsP (für Dauer als Blaufalke)",pfeil:false,
    info:"Probe: MU/IN/GE · Kosten: 4 AsP + 3 AsP/SR (Blaufalke) · Selbst · je nach AsP · Komplexität B · LC S.15",
    w(z,asp){
      if(z===null)return"Die Probe ist misslungen – die Verwandlung gelingt nicht.";
      const sr=Math.floor((asp||0)/3);
      return`Verwandlung in das erlernte Tier (hier: Blaufalke) gelingt. Der Zaubernde erhält Gestalt, körperliche Fähigkeiten, Wahrnehmung und Lebensenergie des Tieres. Körperwerte max. doppelter ZfW. Kein Zaubern in Tiergestalt, keine vorzeitige Rückverwandlung.<br><br><span class="bold">Kosten:</span> 4 AsP Verwandlung + laufende AsP (Blaufalke: 3 AsP/SR)<br><span class="bold">Dauer mit ${asp||0} weiteren AsP:</span> ${asp>0?`ca. ${sr} Spielrunde(n)`:"Je nach AsP-Einsatz"}`;
    }
  },
armatrutz:{
    n:"Armatrutz",a:["IN","GE","KO"],c:0,mr:false,ex:true,xl:"Gewünschter RS-Zuwachs",pfeil:false,
    info:"Probe: IN/GE/KO · Kosten: (RS-Zuwachs)² − ZfP*/2, mind. 4 AsP · Selbst · max. 1 SR (A) · Komplexität B · Merkmale: Eigenschaften, Elementar (Erz) · LC S.27",
    w(z,asp){
      if(z===null)return"Die Probe ist misslungen – der Schutz entsteht nicht.";
      const rs=asp||0;
      const zfw=parseInt(document.getElementById('zfw').value)||10;
      const k=Math.max(4,rs*rs-Math.floor(z/2));
      return`RS-Zuwachs: <span class="bold">+${rs}</span> · Max. möglicher Zuwachs: ZfW/2 = <span class="bold">${Math.floor(zfw/2)}</span><br><br><span class="bold">Kosten:</span> ${rs}² − ZfP*/2 = ${rs*rs} − ${Math.floor(z/2)} = <span class="bold">${k} AsP</span> (mindestens 4 AsP)<br><br>Keine Behinderung. Wirkt gegen alle materiellen Angriffe und Dämonenattacken mit materieller Komponente. Wirkt <em>nicht</em> gegen reine Zauberschäden (z.B. FULMINICTUS).`;
    }
  },
balsam:{
    n:"Balsam Salabunde",a:["KL","IN","CH"],c:0,mr:false,ex:true,xl:"Eingesetzte AsP (= geheilte LeP)",pfeil:false,
    info:"Probe: KL/IN/CH · Kosten: 1 AsP pro LeP, mind. 5 AsP · Selbst/Berührung · Augenblicklich · Komplexität C · Merkmale: Heilung, Form · LC S.36",
    w(z,asp){
      if(z===null)return"Die Probe ist misslungen – der Zauber wirkt nicht.";
      const zfw=parseInt(document.getElementById('zfw').value)||10;
      const max=zfw*2;
      const lep=Math.min(asp||0,max);
      return`Heilung von <span class="bold">${lep} LeP</span> (Maximum ZfW×2 = ${max} LeP). Wunden, Krankheiten und Vergiftungen werden geheilt – aber nicht gestoppt.<br><br><span class="bold">Optionalregel:</span> Je 7 geheilte LeP = 1 Wunde vollständig geheilt.<br><span class="bold">Kosten:</span> ${Math.max(5,asp||0)} AsP`;
    }
  },

function meter(key,label,max,color){
  const v=S[key];const pct=clamp(v/max*100,0,100);
  let col=color||'var(--green)', note='';
  if(key==='lep'){
    col=v<=5?'var(--red)':v<=Math.ceil(max/4)?'var(--red)':v<=Math.ceil(max/3)?'var(--amber)':v<=Math.ceil(max/2)?'#b9b04a':'var(--green)';
    if(v<=0)note='<span class="tag r">Lebensgefahr!</span>';
    else if(v<=5)note='<span class="tag r">kampfunfähig (≤5 LeP)</span>';
    else if(v<=Math.ceil(max/4))note='<span class="tag r">unter ¼ LeP</span>';
    else if(v<=Math.ceil(max/3))note='<span class="tag a">unter ⅓ LeP</span>';
    else if(v<=Math.ceil(max/2))note='<span class="tag a">unter ½ LeP</span>';
  }
  if(key==='aup'&&v<=0)note='<span class="tag r">erschöpft: handlungsunfähig</span>';
  if(key==='asp'&&v<=0)note='<span class="tag a">keine AsP: kein Zaubern</span>';
  if(key==='asp')col='var(--violet)';
  if(key==='aup')col='var(--blue)';
  return `<div class="card meter">
    <div class="row sp"><div class="lbl" style="margin:0">${label}</div><div>${note}</div></div>
    <div class="row sp" style="margin-top:6px">
      <button class="btn" data-act="adj" data-k="${key}" data-d="-5">−5</button>
      <button class="btn" data-act="adj" data-k="${key}" data-d="-1">−1</button>
      <div class="val mono">${v}<small> / ${max}</small></div>
      <button class="btn" data-act="adj" data-k="${key}" data-d="1">+1</button>
      <button class="btn" data-act="adj" data-k="${key}" data-d="5">+5</button>
    </div>
    <div class="bar"><i style="width:${pct}%;background:${col}"></i></div>
    <div class="row"><input type="number" id="amt-${key}" placeholder="Menge" inputmode="numeric" style="max-width:110px">
      <button class="btn grow" data-act="amt" data-k="${key}" data-s="-1">${key==='lep'?'Schaden':'Abziehen'}</button>
      <button class="btn grow" data-act="amt" data-k="${key}" data-s="1">${key==='lep'?'Heilen':'Zurück'}</button></div>
  </div>`;
}

function adjVal(k,d){
  const max={lep:CHAR.max.lep,aup:CHAR.max.aup,asp:CHAR.max.asp}[k];
  S[k]=clamp(S[k]+d,0,max+(k==='lep'?0:0));save();renderStatus();
}
$('t-status').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='adj')adjVal(b.dataset.k,+b.dataset.d);
  else if(a==='amt'){const v=num('amt-'+b.dataset.k,0);if(!v){toast('Menge eingeben');return;}adjVal(b.dataset.k,v*(+b.dataset.s));}
  else if(a==='hit'){
    const tp=num('in-tp',0),rs=num('in-rs',S.rs);S.rs=rs;
    const sp=Math.max(0,tp-rs);const wund=sp>=CHAR.wundschwelle;
    S.lep=clamp(S.lep-sp,0,CHAR.max.lep);if(wund)S.wunden++;save();renderStatus();
    $('hit-res').innerHTML=`<span class="tag ${wund?'r':'a'}">TP ${tp} − RS ${rs} = ${sp} SP${wund?' → Wunde!':''}</span>`;
  }
  else if(a==='wund'){S.wunden=Math.max(0,S.wunden+ +b.dataset.d);save();renderStatus();}
  else if(a==='be'){S.be=Math.max(0,S.be+ +b.dataset.d);save();renderStatus();}
  else if(a==='rs'){S.rs=Math.max(0,S.rs+ +b.dataset.d);save();renderStatus();}
  else if(a==='fadj'){const k=b.dataset.k;const mx=k==='fLep'?CHAR.falke.lep:CHAR.falke.aup;S[k]=clamp(S[k]+ +b.dataset.d,0,mx);save();renderStatus();}
  else if(a==='effadd'){const n=$('eff-n').value.trim(),d=num('eff-d',0);if(!n||d<=0){toast('Name und Dauer eingeben');return;}S.effekte.push({n,d,u:$('eff-u').value});save();renderStatus();}
  else if(a==='effdel'){S.effekte.splice(+b.dataset.i,1);save();renderStatus();}
  else if(a==='nextkr'){S.kr++;S.effekte.forEach(x=>{if(x.u==='KR')x.d--;});const gone=S.effekte.filter(x=>x.d<=0);S.effekte=S.effekte.filter(x=>x.d>0);save();renderStatus();if(gone.length)toast('Beendet: '+gone.map(g=>g.n).join(', '));}
  else if(a==='nextsr'){S.kr=0;S.effekte.forEach(x=>{if(x.u==='SR')x.d--;});const gone=S.effekte.filter(x=>x.u==='KR'||x.d<=0);S.effekte=S.effekte.filter(x=>x.u==='SR'&&x.d>0);save();renderStatus();if(gone.length)toast('Beendet: '+gone.map(g=>g.n).join(', '));}
  else if(a==='rest'){S.lep=clamp(S.lep+num('rest-l',0),0,CHAR.max.lep);S.asp=clamp(S.asp+num('rest-a',0),0,CHAR.max.asp);S.aup=clamp(S.aup+num('rest-u',0),0,CHAR.max.aup);save();renderStatus();toast('Eingetragen');}
  else if(a==='full'){if(confirm('LeP, AuP und AsP voll auffüllen, Wunden und Effekte zurücksetzen?')){S.lep=CHAR.max.lep;S.aup=CHAR.max.aup;S.asp=CHAR.max.asp;S.wunden=0;S.effekte=[];S.kr=0;S.fLep=CHAR.falke.lep;S.fAup=CHAR.falke.aup;save();renderStatus();}}
});

let pFilter='Alle', pSearch='';
const GRP=['Alle','Körper','Gesellschaft','Natur','Wissen','Handwerk','Sprachen','Eigene'];
function renderProben(){
  const fav=['Sinnenschärfe','Orientierung','Wettervorhersage','Schleichen','Fährtensuchen','Heilkunde Wunden','Seefahrt','Sternkunde'];
  const items=CHAR.talente.filter(t=>(pFilter==='Alle'||t[1]===pFilter)&&t[0].toLowerCase().includes(pSearch.toLowerCase()));
  $('t-proben').innerHTML=`
  <div class="card"><h2>Eigenschaftsprobe</h2>
    <div class="grid4">${Object.keys(CHAR.attr).map(a=>`<button class="btn" data-act="ep" data-a="${a}"><b class="bold">${a}</b><br><span class="dim small">${CHAR.attr[a]}</span></button>`).join('')}</div>
  </div>
  ${pFilter==='Alle'&&!pSearch?`<div class="card"><h2>Favoriten</h2><div class="list">${fav.map(f=>item(CHAR.talente.findIndex(t=>t[0]===f))).join('')}</div></div>`:''}
  <input type="text" id="p-search" placeholder="Talent suchen …" value="${esc(pSearch)}" style="margin-bottom:8px">
  <div class="chips">${GRP.map(g=>`<button class="chip ${pFilter===g?'on':''}" data-act="pf" data-g="${g}">${g}</button>`).join('')}</div>
  <div class="list">${items.map(t=>item(CHAR.talente.indexOf(t))).join('')||'<div class="dim">Nichts gefunden.</div>'}</div>`;
  const s=$('p-search');s.addEventListener('input',()=>{pSearch=s.value;const p=s.selectionStart;renderProben();const n=$('p-search');n.focus();n.setSelectionRange(p,p);});

/* Kernlogik Talentprobe (DSA 4.1): 3W20 gegen drei Eigenschaften, Fehlpunkte aus TaW */
function talentProbe(att,taw,mod,dice){
  const ones=dice.filter(d=>d===1).length, tw=dice.filter(d=>d===20).length;
  const puffer=Math.max(0,taw-mod), malus=Math.max(0,mod-taw);
  let rem=puffer;const det=[];
  for(let i=0;i<3;i++){const ea=att[i].v-malus,d=dice[i];
    if(d<=ea)det.push({n:att[i].n,ea,d,o:0});else{const o=d-ea;rem-=o;det.push({n:att[i].n,ea,d,o});}}
  let ok=rem>=0, flag='';
  if(tw>=3)flag='Spektakulärer Patzer';else if(tw>=2)flag='Patzer (Doppel-20)';
  if(ones>=3)flag='Spektakulärer Erfolg';else if(ones>=2)flag='Glücklicher Erfolg (Doppel-1)';
  if(tw>=2)ok=false;else if(ones>=2)ok=true;
  let tap=null;
  if(ok)tap=Math.max(1,Math.min(Math.max(rem,0),Math.max(taw,1)));
  return {ok,tap,rem,det,puffer,malus,flag,ones,tw};
}
function diceInputs(prefix,names,def){
  return `<div class="grid3">${names.map((n,i)=>`<div><div class="dice-lbl">${n.n} <b class="bold">${n.v}</b></div><input type="number" id="${prefix}${i}" min="1" max="20" inputmode="numeric" placeholder="W20" value="${def?def[i]:''}"></div>`).join('')}</div>`;
}
function readDice(prefix,n){const r=[];for(let i=0;i<n;i++){const v=parseInt($(prefix+i).value);if(isNaN(v)||v<1||v>20)return null;r.push(v);}return r;}

let curSpell=null,lastBuch=null;
function spellCost(k,z,xv,perm){
  if(k==='armatrutz')return Math.max(4,xv*xv-Math.floor((z||0)/2));
  if(k==='balsam')return Math.max(5,xv);
  if(k==='adlerschwinge')return 4+xv;
  if(k==='spinnenlauf')return 7+xv;
  if(k==='firnlauf')return 5+xv;
  if(k==='pe'||k==='ph')return perm?21:8;
  if(String(k).startsWith('x:'))return getSpell(k).c+xv;
  return getSpell(k).c;
}
function spellDur(k,z,xv){
  if(k==='pe'||k==='ph'||k==='chamaelioni')return ['KR',z*10];
  if(k==='armatrutz'||k==='adlerauge')return ['SR',1];
  if(k==='adlerschwinge')return ['SR',Math.max(1,Math.floor(xv/3))];
  if(k==='spinnenlauf'||k==='firnlauf')return ['SR',Math.max(1,Math.floor(xv/2))];
  if(k==='juckreiz')return ['SR',Math.max(1,Math.floor(z/2))];
  return null;
}

function calcSpell(){
  const k=curSpell,s=getSpell(k);
  const attrs=s.a.map(a=>CHAR.attr[a]);
  const zfw=num('zfw',0);
  const dice=readDice('spd',3);if(!dice){toast('Drei Würfel (1–20) eingeben');return;}
  const mr=s.mr?num('mr',0):0, xv=s.ex?num('xv',0):0;
  const permCheck=$('perm-check'),weaponSel=$('weapon-type');
  const permMod=(permCheck&&permCheck.checked)?7:0, weapMod=weaponSel?parseInt(weaponSel.value)||0:0;
  const gen=num('sp-mod',0);
  const totalMod=permMod+weapMod+gen;
  const ones=dice.filter(d=>d===1).length,tw=dice.filter(d=>d===20).length;
  let h=`<div class="res"><div class="lbl">${esc(s.n)}</div>`;
  let cost,ok,zfp=null;
  if(ones>=2){
    zfp=Math.max(0,zfw*2-Math.max(0,totalMod));ok=true;
    h+=`<div class="big good">✦ Kritischer Erfolg</div><div class="t">Alle drei Würfel bestanden. ZfP* = ZfW×2 − Erschwernis = <span class="bold">${zfp}</span><br><br>${s.w(zfp,xv)}</div>`;
  }else if(tw>=2){
    ok=false;h+=`<div class="big bad">✦ Patzer</div><div class="t">Der Meister bestimmt die Folgen laut Fehlzauber-Tabelle. AsP-Kosten fallen trotzdem an.</div>`;
  }else{
    const puffer=Math.max(0,zfw-totalMod), malus=Math.max(0,totalMod-zfw);
    const mod=attrs.map(a=>(s.mr?a-mr:a)-malus);
    let rem=puffer;const det=[];
    for(let i=0;i<3;i++){const ea=mod[i],d=dice[i];if(d<=ea)det.push({a:s.a[i],ea,d,o:0});else{const o=d-ea;rem-=o;det.push({a:s.a[i],ea,d,o});}}
    ok=rem>=0;if(ok)zfp=rem;
    h+=`<div class="big ${ok?'good':'bad'}">${ok?'✦ Gelungen':'✦ Misslungen'}${ok?` · ZfP* ${rem}`:''}</div><div style="margin-top:6px">`+
       det.map(d=>`<span class="tag ${d.o?'r':'g'}">${d.a} ${d.ea}: W${d.d} ${d.o?'−'+d.o:'✓'}</span>`).join('')+`</div><div class="t">`;
    if(totalMod>0){h+=`Erschwernis <span class="bold">${totalMod}</span>${malus>0?` · ZfW aufgebraucht → Eigenschaften je −${malus}`:''}<br>`;}
    h+=`ZfW-Puffer <span class="bold">${puffer}</span> − Fehlpunkte <span class="bold">${puffer-rem}</span> = <span class="bold">${rem}</span><br><br>${s.w(ok?rem:null,xv)}</div>`;
  }
  cost=spellCost(k,zfp,xv,permCheck&&permCheck.checked);
  logRoll('Zauber',s.n.split(' (')[0],'W'+dice.join('/')+' → '+(ones>=2?'kritischer Erfolg, ZfP* '+zfp:tw>=2?'Patzer':(ok?'ZfP* '+zfp:'misslungen')),ok);
  const pay=ok?cost:Math.ceil(cost/2);
  h+=`<hr><div class="row sp"><div>Kosten: <span class="bold">${pay} AsP</span>${ok?'':' <span class="dim small">(halbe Kosten bei Misserfolg)</span>'}${permCheck&&permCheck.checked&&ok?' <span class="dim small">(davon 1 permanent)</span>':''}<div class="dim small">AsP aktuell: ${S.asp}</div></div>
    <button class="btn pri" data-act="buch">Abbuchen</button></div></div>`;
  lastBuch={k,pay,ok,zfp,xv,dur:ok?spellDur(k,zfp,xv):null};
  $('sp-res').innerHTML=h;
}
$('t-zauber').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='zs'){curSpell=b.dataset.k;renderZauber();}
  else if(a==='zmore')openSpellList();

function fernCalc(){

/* ---------- Regel-Suche (Index nur lokal, nicht im Repository) ---------- */
let RULES=null, rQuery='', rOpen=null;
const RN=s=>s.toLowerCase().replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss');
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('shaelyra',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbGet(k){const db=await idbOpen();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function idbSet(k,v){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function idbDel(k){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
function prepRules(d){return {books:d.books,docs:d.docs.map(a=>({b:a[0],p:a[1],t:a[2],n:RN(a[2])}))};}
async function ensureRules(){
  if(RULES)return RULES;
  try{const d=await idbGet('idx');if(d)RULES=prepRules(d);}catch(e){}
  return RULES;
}
function ruleSearch(q){
  if(!RULES)return [];
  const toks=RN(q).split(/[^a-z0-9*]+/).filter(x=>x.length>1);
  if(!toks.length)return [];
  const phrase=RN(q).trim();
  const out=[];
  for(const d of RULES.docs){
    let score=0,ok=true;
    for(const t of toks){const i=d.n.indexOf(t);if(i<0){ok=false;break;}score+=3+Math.min(6,(d.n.split(t).length-1));if(i<80)score+=2;}
    if(!ok)continue;
    if(toks.length>1&&d.n.includes(phrase))score+=12;
    if(d.n.slice(0,60).includes(phrase))score+=15;
    if(d.b==='Liber Cantiones'&&d.n.includes('probe:'))score+=6;
    out.push([score,d]);
  }
  out.sort((a,b)=>b[0]-a[0]);
  return out.slice(0,30).map(x=>x[1]);
}
function snippet(d,toks){
  const t=d.t;const n=d.n;let i=-1;
  for(const k of toks){const j=n.indexOf(k);if(j>=0&&(i<0||j<i))i=j;}
  const s=Math.max(0,i-90);let sn=t.slice(s,s+320);
  let h=esc((s>0?'… ':'')+sn+(s+320<t.length?' …':''));
  for(const k of toks){const re=new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');h=h.replace(re,'<mark style="background:#6b4f12;color:#fff4d6">$1</mark>');}
  return h;
}
async function renderRegeln(){
  $('t-regeln').innerHTML=`<div id="r-body"><div class="dim small card">Lade …</div></div>`;
  await ensureRules();
  const have=!!RULES;
  const toks=RN(rQuery).split(/[^a-z0-9*]+/).filter(x=>x.length>1);
  let res='';
  if(have&&toks.length){
    const r=ruleSearch(rQuery);
    res=r.length?r.map((d,i)=>`<button class="item" data-act="ropen" data-i="${i}" style="display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px">
        <div class="row sp"><span class="tag b">${esc(d.b)}${d.p?', S. '+d.p:''}</span></div>
        <div class="small" style="margin-top:4px">${rOpen===i?esc(d.t).replace(/\n/g,'<br>'):snippet(d,toks)}</div></button>`).join(''):'<div class="dim">Nichts gefunden. Anderes Wort oder weniger Begriffe versuchen.</div>';
    window._rres=r;
  }
  $('t-regeln').innerHTML=`
  <div class="card"><h2>Regel-Suche</h2>
    <div class="row"><input type="text" id="r-q" placeholder="${have?'z. B. Finte, Kälteschaden, Wundschwelle':'Erst den Index importieren (unten)'}" value="${esc(rQuery)}" ${have?'':'disabled'} style="flex:1" enterkeyhint="search">
    <button class="btn pri" data-act="rgo" ${have?'':'disabled'}>Suchen</button></div>
    ${have?`<div class="dim tiny" style="margin-top:6px">${RULES.docs.length} Textstellen aus ${RULES.books.length} Büchern · alle Wörter müssen vorkommen</div>`:''}
  </div>
  ${res?`<div class="list" id="r-res">${res}</div>`:''}
  <div class="card"><h2>Regelbuch-Index</h2>
    ${have?`<div class="small good">Index geladen.</div>`:`<div class="small dim">Der Index enthält Buchtext und liegt deshalb nicht im öffentlichen Repository. Die Datei <b>regeln_index.json.gz</b> aus dem Ordner <i>Tool/privat</i> einmal pro Gerät hier laden.</div>`}
    <div class="row" style="margin-top:8px"><label class="btn grow" style="margin:0;text-align:center;cursor:pointer;color:var(--text)"><input type="file" id="r-file" accept=".gz,.json,application/json,application/gzip" style="display:none">${have?'Neuen Index laden':'Index-Datei auswählen'}</label>
    ${have?'<button class="btn dng" data-act="rdel">Löschen</button>':''}</div>
    <div id="r-msg" class="small" style="margin-top:6px"></div></div>
  <div class="card"><h2>Schnelle Hilfe</h2>${cheatHtml()}</div>`;
  const q=$('r-q');if(q){q.addEventListener('keydown',ev=>{if(ev.key==='Enter'){rQuery=q.value;rOpen=null;renderRegeln();}});}
  $('r-file').addEventListener('change',importRules);
}
async function importRules(ev){
  const f=ev.target.files[0];if(!f)return;const m=$('r-msg');m.textContent='Lese Datei …';
  try{
    let text;
    if(/\.gz$/i.test(f.name)){
      if(typeof DecompressionStream==='undefined')throw new Error('Dieser Browser kann .gz nicht entpacken, bitte die .json-Datei nehmen.');
      const ds=f.stream().pipeThrough(new DecompressionStream('gzip'));
      text=await new Response(ds).text();
    }else text=await f.text();
    m.textContent='Verarbeite …';
    const d=JSON.parse(text);if(!d.docs||!d.books)throw new Error('Datei hat nicht das erwartete Format.');
    await idbSet('idx',d);RULES=prepRules(d);
    toast('Index geladen: '+RULES.docs.length+' Stellen');renderRegeln();
  }catch(e){m.innerHTML='<span class="bad">Fehler: '+esc(e.message)+'</span>';}
}

function costNum(k){const m=String(k).match(/(\d+)/);return m?parseInt(m[1]):0;}
function getSpell(k){
  if(SP[k])return SP[k];

  if(x._g)return x._g;
  const mr=/MR/.test(x.m);
  x._g={n:x.n,a:x.a,c:costNum(x.k),mr:mr,ex:true,xl:'Zusätzliche AsP (laut Kostenangabe)',pfeil:false,
    info:`Probe: ${x.a.join('/')}${x.m?' ('+x.m+')':''} · Zauberdauer ${x.zd} · Kosten ${x.k} AsP · Reichweite ${x.r} · Wirkungsdauer ${x.w} · Komplexität ${x.c} · Merkmale ${x.mk} · Elfen-Verbreitung ${x.elf}`,
    w(z,asp){
      if(z===null)return 'Die Probe ist misslungen – der Zauber wirkt nicht.';
      return `Gelungen mit <span class="bold">${z} ZfP*</span>.<br><br><span class="bold">Dauer:</span> ${esc(x.w)}<br><span class="bold">Reichweite:</span> ${esc(x.r)}<br><span class="bold">Kosten laut Liste:</span> ${esc(x.k)} AsP<br><br>Wirkung und Varianten stehen im Regelbuch. <button class="btn sm" data-rq="${esc(x.n.split(' ')[0].toLowerCase())} ${esc(x.mk.split(',')[0].toLowerCase())}">Regeltext suchen</button>`;

}

const KDMG=['keiner','1W6 kTP / 6 Std.','1W6 kTP / Std.','1W6 kTP / Viertelstunde','1W6 kTP / Spielrunde','1W6 kTP / Minute','1W6 kTP / halbe Minute','1W6 kTP / 2 KR','1W6 kTP / KR'];
const KNAMEN=['mäßig warm','kühl','kalt','frostig','eisig','firunsfrostig','grimmfrostig','namenlos kalt','niederhöllisch kalt'];
function kClass(t){if(t>10)return 1;if(t>0)return 2;if(t>-10)return 3;if(t>-20)return 4;if(t>-35)return 5;if(t>-50)return 6;if(t>-100)return 7;if(t>-150)return 8;return 9;}
const KSCHUTZ=[[0,'dünner Stoff (0)'],[1,'Wolle, Leinen, Leder (1)'],[2,'dünner Pelz, dicke Wolle, Bausch (2)'],[3,'dicker Pelz (3)'],[4,'Anaurak, gut verarbeitet (4)']];
const KOPT=(sel)=>KSCHUTZ.map(([v,l])=>`<option value="${v}" ${v===sel?'selected':''}>${l}</option>`).join('');
let K={t:-5,wind:0,feucht:false,feuer:false,body:3,kopf:1,fuss:2,zust:'trocken',schlecht:false,res:true,akk:false};
function kaelteHtml(){

  <div class="card"><h2>Umgebung</h2>

    <label class="check"><input type="checkbox" id="k-f" ${K.feucht?'checked':''}> Feuchte Kühle/Kälte (+1, nur bei kühl und kalt)</label>
    <label class="check"><input type="checkbox" id="k-h" ${K.feuer?'checked':''}> Wärmendes Feuer (−1)</label></div>

    ${S.ktp>CHAR.wundschwelle*(S.kwunden+1)-0&&S.ktp>CHAR.wundschwelle?`<div class="warn small" style="margin-top:6px">Kälteschaden über der Wundschwelle: Erfrierung (Kältewunde) möglich.</div>`:''}

function kaelteRead(){
  K.t=parseInt($('k-t').value);if(isNaN(K.t))K.t=0;
  K.wind=+$('k-w').value;K.feucht=$('k-f').checked;K.feuer=$('k-h').checked;
  K.body=+$('k-b').value;K.kopf=+$('k-k').value;K.fuss=+$('k-s').value;K.zust=$('k-z').value;
  K.schlecht=$('k-sch').checked;K.res=$('k-r').checked;K.akk=$('k-a').checked;
}
function kaelteCalc(){
  kaelteRead();
  const base=kClass(K.t);
  let delta={trocken:0,feucht:-1,nass:null,wf:0,wn:-1}[K.zust];
  const adj=p=>{let v=p;if(delta===null)v=0;else v+=delta;if(K.schlecht)v-=1;return Math.max(0,v);};
  const pb=adj(K.body),pk=adj(K.kopf)+1,pf=adj(K.fuss);
  const parts=[['Körper',pb],['Hände/Kopf',pk],['Füße',pf]];
  parts.sort((a,b)=>a[1]-b[1]);
  const prot=parts[0][1];
  let cls=base+K.wind+((K.feucht&&(base===2||base===3))?1:0)-(K.feuer?1:0)-prot-(K.res?1:0)-(K.akk?1:0);
  cls=clamp(cls,1,9);
  $('k-class').innerHTML=`${cls} · ${KNAMEN[cls-1]}`;
  $('k-class').style.color=cls<=1?'var(--green)':cls<=3?'var(--amber)':'var(--red)';
  $('k-dmg').textContent=KDMG[cls-1];
  $('k-brk').innerHTML=`Temperatur ${K.t} °C = Klasse ${base}${K.wind?` · Wind +${K.wind}`:''}${(K.feucht&&(base===2||base===3))?' · feucht +1':''}${K.feuer?' · Feuer −1':''} · Schutz −${prot} (schwächster Teil: ${parts[0][0]})${K.res?' · Resistenz −1':''}${K.akk?' · Akklimatisierung −1':''}`;
}

    <details><summary>Wunden</summary><div class="small">Schaden (nach RS) ≥ Wundschwelle (${CHAR.wundschwelle}) = Wunde. Je Wunde AT, PA, GE, INI −2 und GS −1. Bei Pfeilen: Wunde bei mehr als KO/2 − 2 SP. LeP ≤ 5: kampfunfähig, ≤ 0: Lebensgefahr.</div></details>
